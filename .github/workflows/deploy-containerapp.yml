name: Deploy Container App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-containerapp.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrazureopsdev

      - name: Build and push container image
        run: |
          docker build \
            -t acrazureopsdev.azurecr.io/azureops-portal:${{ github.sha }} \
            -t acrazureopsdev.azurecr.io/azureops-portal:latest \
            ./app
          docker push acrazureopsdev.azurecr.io/azureops-portal:${{ github.sha }}
          docker push acrazureopsdev.azurecr.io/azureops-portal:latest

      - name: Deploy new image to Container App
        run: |
          az containerapp registry set \
            --name ca-azureops-dev \
            --resource-group rg-azureops-dev \
            --server acrazureopsdev.azurecr.io \
            --identity system

          az containerapp update \
            --name ca-azureops-dev \
            --resource-group rg-azureops-dev \
            --image acrazureopsdev.azurecr.io/azureops-portal:${{ github.sha }} \
            --target-port 8080